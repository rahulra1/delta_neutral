<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Delta Neutral Bot</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: #fafafa; color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 36px; width: 360px; }
  .logo { font-size: 1.2rem; font-weight: 700; color: #1a1a2e; text-align: center; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .field label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input { border: 1px solid #e8e8e8; padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
  .field input:focus { outline: none; border-color: #1a1a2e; }
  button { width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; font-size: 0.9rem; font-family: inherit; font-weight: 600; cursor: pointer; }
  .error { color: #ef4444; font-size: 0.8rem; text-align: center; margin-bottom: 12px; }
  .link { text-align: center; margin-top: 16px; font-size: 0.8rem; color: #9ca3af; }
  .link a { color: #1a1a2e; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<form class="card" method="POST" action="/register">
  <div class="logo">⚡ Delta Neutral</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="field"><label>Username</label><input name="username" required autofocus></div>
  <div class="field"><label>Password</label><input name="password" type="password" required></div>
  <div class="field"><label>Confirm Password</label><input name="confirm_password" type="password" required></div>
  <button type="submit">Register</button>
  <div class="link">Already have an account? <a href="/login">Login</a></div>
</form>
</body>
</html>

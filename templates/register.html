<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Delta Neutral Bot</title>
<style>
  :root { --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --accent: #6c5ce7; --red: #e17055; --text: #dfe6e9; --muted: #636e72; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Fira Code', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 36px; width: 340px; }
  h1 { font-size: 1.1rem; color: var(--accent); margin-bottom: 24px; text-align: center; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .field label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .field input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
  .field input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-family: inherit; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
  .error { color: var(--red); font-size: 0.8rem; text-align: center; margin-bottom: 12px; }
  .link { text-align: center; margin-top: 16px; font-size: 0.8rem; }
  .link a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<form class="login-box" method="POST" action="/register">
  <h1>⚡ Create Account</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="field"><label>Username</label><input name="username" required autofocus></div>
  <div class="field"><label>Password</label><input name="password" type="password" required></div>
  <div class="field"><label>Confirm Password</label><input name="confirm_password" type="password" required></div>
  <button type="submit">Register</button>
  <div class="link">Already have an account? <a href="/login">Login</a></div>
</form>
</body>
</html>

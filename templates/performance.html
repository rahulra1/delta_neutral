<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance — Delta Neutral Bot</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  table{width:100%;border-collapse:collapse}
  th{font-size:.7rem;color:var(--muted);text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border)}
  td{font-size:.85rem;padding:10px 14px;border-bottom:1px solid var(--border)}
  tr:last-child td{border-bottom:none}
  tr:hover{background:var(--bg)}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class='nav'><div class='logo'>⚡ Delta Neutral</div><a href='/'>Dashboard</a><a href='/option-chain'>Option Chain</a><a href='/strategy/new?asset=BTC'>Strategies</a><a href='/strategy-builder'>Builder</a><a href='/performance' class='active'>Performance</a><a href='/profile'>Profile</a><a href="/broker">Broker</a><div class='spacer'></div><div class='user'><div class='avatar'>{{ username[0]|upper }}</div><span>{{ username }}</span><a href='/logout' style='border:none;padding:0;font-size:.75rem'>Logout</a></div></div>

<div class="container">
  <div class="page-title">📊 Performance</div>

  <div class="grid-3" id="summary">
    <div class="card" style="text-align:center"><div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Total Trades</div><div style="font-size:1.3rem;font-weight:700" id="s_trades">—</div></div>
    <div class="card" style="text-align:center"><div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Total PnL</div><div style="font-size:1.3rem;font-weight:700" id="s_pnl">—</div></div>
    <div class="card" style="text-align:center"><div style="font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Win Rate</div><div style="font-size:1.3rem;font-weight:700" id="s_winrate">—</div></div>
  </div>

  <div class="card">
    <h2>Trade History</h2>
    <table>
      <thead><tr><th>SID</th><th>Started</th><th>Ended</th><th>Expiry</th><th>Lots</th><th>Delta</th><th>Adj</th><th>Status</th><th>PnL</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No trade history yet.</div>
  </div>
</div>

<script>
fetch('/api/history').then(r=>r.json()).then(data=>{
  const tb=document.getElementById('tbody'),em=document.getElementById('empty');
  if(!data.length){em.style.display='block';return}

  const wins=data.filter(d=>d.pnl>0).length;
  const total=data.reduce((s,d)=>s+d.pnl,0);
  document.getElementById('s_trades').textContent=data.length;
  const pe=document.getElementById('s_pnl');
  pe.textContent='$'+total.toFixed(2);
  pe.style.color=total>=0?'var(--green)':'var(--red)';
  document.getElementById('s_winrate').textContent=(wins/data.length*100).toFixed(0)+'%';

  data.forEach(d=>{
    const tr=document.createElement('tr');
    const s=d.started_at?new Date(d.started_at).toLocaleDateString():'—';
    const e=d.ended_at?new Date(d.ended_at).toLocaleDateString():'—';
    const p=d.params||{};
    const cls=d.pnl>=0?'val-green':'val-red';
    const badge=d.status==='completed'?'badge-green':d.status==='running'?'badge-yellow':'badge-red';
    tr.innerHTML=`<td>${d.sid||'—'}</td><td>${s}</td><td>${e}</td><td>${p.expiry_date||'—'}</td><td>${p.lot_size||'—'}</td><td>${p.target_delta||'—'}</td><td>${d.adjustments}</td><td><span class="badge ${badge}">${d.status}</span></td><td class="${cls}">$${d.pnl.toFixed(2)}</td>`;
    tb.appendChild(tr);
  });
});
</script>
</body>
</html>

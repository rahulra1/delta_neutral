<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Delta Neutral Bot</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background: #fafafa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #fff; border: 1px solid #e8e8e8; border-radius: 12px; padding: 36px; width: 340px; }
  h1 { font-size: 1.1rem; color: #1a1a2e; margin-bottom: 24px; text-align: center; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .field label { font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input { background: #fafafa; border: 1px solid #e8e8e8; color: #1a1a2e; padding: 10px 12px; border-radius: 6px; font-family: inherit; font-size: 0.9rem; }
  .field input:focus { outline: none; border-color: #1a1a2e; }
  button { width: 100%; padding: 10px; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
  .error { color: #ef4444; font-size: 0.8rem; text-align: center; margin-bottom: 12px; }
  .link { text-align: center; margin-top: 16px; font-size: 0.8rem; color: #9ca3af; }
  .link a { color: #1a1a2e; text-decoration: none; }
</style>
</head>
<body>
<form class="login-box" method="POST" action="/login">
  <h1>⚡ Delta Neutral</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="field"><label>Username</label><input name="username" required autofocus></div>
  <div class="field"><label>Password</label><input name="password" type="password" required></div>
  <button type="submit">Login</button>
  <div class="link">Don't have an account? <a href="/register">Register</a></div>
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option Chain — AlgoX</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#f5f5f5;--card:#fff;--border:#e0e3e8;--accent:#1a1a2e;--green:#02c076;--red:#f6465d;--text:#1a1a2e;--muted:#848e9c;--call-bg:rgba(2,192,118,0.04);--put-bg:rgba(246,70,93,0.04);--itm:rgba(99,102,241,0.06);--hover:rgba(26,26,46,0.03)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;background:var(--bg);color:var(--text);min-height:100vh;font-size:12px}
.container{max-width:1440px;margin:0 auto;padding:12px 16px}
h1{font-size:1.1rem;font-weight:700;color:var(--text)}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.controls select,.controls button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:4px;font-family:inherit;font-size:12px;cursor:pointer}
.controls select:hover,.controls button:hover{border-color:var(--accent)}
.controls .btn-load{background:var(--accent);color:#0b0e11;border:none;font-weight:700}
.spot-badge{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:6px 14px;font-weight:700;color:var(--accent);font-size:13px}
.chain-wrap{overflow-x:auto;margin-bottom:12px;max-height:60vh;overflow-y:auto;border:1px solid var(--border);border-radius:4px}
.chain-wrap::-webkit-scrollbar{width:6px;height:6px}
.chain-wrap::-webkit-scrollbar-track{background:var(--bg)}
.chain-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
th{background:var(--card);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;padding:8px 5px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border);font-weight:600}
th.strike-hdr{background:var(--accent);color:#fff;font-size:11px;min-width:80px;border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
th.call-hdr{color:var(--green)}
th.put-hdr{color:var(--red)}
td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-family:'SF Mono','Fira Code',monospace;font-size:11px}
tr:hover td{background:var(--hover)}
.call-side{background:var(--call-bg)}
.put-side{background:var(--put-bg)}
.strike-col{background:#f0f1f3;font-weight:700;font-size:12px;color:var(--accent);text-align:center;border-left:2px solid rgba(26,26,46,0.2);border-right:2px solid rgba(26,26,46,0.2)}
.itm{background:var(--itm)!important}
tr.atm-bar td{padding:0;height:3px;border:none}
tr.atm-bar .atm-line{background:linear-gradient(90deg,transparent,var(--accent),transparent);height:2px}
tr.atm-bar .atm-label{position:relative}
tr.atm-bar .atm-label span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:9px;padding:2px 10px;border-radius:3px;font-weight:700;white-space:nowrap}
.oi-bar{display:inline-block;height:8px;border-radius:1px;min-width:1px;vertical-align:middle;margin-right:2px;opacity:.7}
.oi-bar.call{background:var(--green)}.oi-bar.put{background:var(--red)}
.delta{color:var(--accent);font-weight:600}
.iv{color:var(--muted)}
td.selectable{cursor:pointer;transition:background .1s}
td.selectable:hover{background:rgba(26,26,46,0.06)!important}
td.selected-buy{outline:1px solid var(--green);outline-offset:-1px;background:rgba(2,192,118,0.15)!important}
td.selected-sell{outline:1px solid var(--red);outline-offset:-1px;background:rgba(246,70,93,0.15)!important}
.builder{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
.builder h3{font-size:.85rem;color:var(--text);margin-bottom:10px}
.legs-table{width:100%;font-size:11px;margin-bottom:10px}
.legs-table th{background:transparent;color:var(--muted);text-align:left;padding:4px 8px;border:none}
.legs-table td{text-align:left;padding:4px 8px;border:none;font-family:'SF Mono','Fira Code',monospace}
.legs-table .remove{color:var(--red);cursor:pointer;font-size:14px}
.side-toggle{display:inline-flex;border-radius:3px;overflow:hidden;font-size:10px;font-weight:700}
.side-toggle span{padding:3px 10px;cursor:pointer}
.side-toggle .buy{background:rgba(2,192,118,0.15);color:var(--green)}
.side-toggle .sell{background:rgba(246,70,93,0.15);color:var(--red)}
.side-toggle .active-buy{background:var(--green);color:#fff}
.side-toggle .active-sell{background:var(--red);color:#fff}
.builder input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:3px;width:60px;font-family:inherit;text-align:center}
.btn-execute{background:var(--green);color:#fff;border:none;padding:8px 20px;border-radius:4px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-execute:hover{opacity:.85}
.btn-clear{background:var(--border);color:var(--text);border:none;padding:8px 20px;border-radius:4px;font-weight:600;cursor:pointer}
.summary-row{display:flex;gap:12px;margin:10px 0;font-size:.8rem;flex-wrap:wrap}
.summary-row .item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;text-align:center;min-width:90px}
.summary-row .item:hover{border-color:var(--accent)}
.summary-row .item .lbl{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.summary-row .item .val{font-size:.95rem;font-weight:700;margin-top:2px}
.payoff-wrap{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:10px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:12px 20px;border-radius:6px;font-weight:700;display:none;z-index:999}
.toast.error{background:var(--red);color:#fff}
.positions-section{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
.pos-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pos-header h3{font-size:.85rem;color:var(--text)}
.pos-list{display:flex;flex-wrap:wrap;gap:8px}
.pos-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 14px;cursor:pointer;font-size:11px;transition:all .15s;min-width:180px}
.pos-card:hover{border-color:var(--accent)}
.pos-card.selected{border-color:var(--accent);box-shadow:0 0 8px rgba(26,26,46,0.15)}
.pos-card .pos-sym{font-weight:700;font-size:12px;margin-bottom:4px;color:var(--text)}
.pos-card .pos-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px}
.pos-card .pos-row .v{color:var(--text);font-weight:600}
.pos-card .pos-side{display:inline-block;padding:1px 8px;border-radius:2px;font-size:9px;font-weight:700}
.pos-card .pos-side.buy{background:rgba(2,192,118,0.15);color:var(--green)}
.pos-card .pos-side.sell{background:rgba(246,70,93,0.15);color:var(--red)}
/* Expiry tabs */
.expiry-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.expiry-tabs::-webkit-scrollbar{height:3px}
.expiry-tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.expiry-tab{padding:5px 14px;border-radius:3px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:var(--card);border:1px solid var(--border);color:var(--muted);transition:all .15s}
.expiry-tab:hover{border-color:var(--accent);color:var(--text)}
.expiry-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mode-switch{display:flex;background:var(--card);border:1px solid var(--border);border-radius:4px;overflow:hidden;font-size:11px}
.mode-opt{padding:5px 14px;cursor:pointer;font-weight:600;color:var(--muted);transition:all .15s;user-select:none}
.mode-opt:hover{color:var(--text)}
.mode-opt.active[data-mode="live"]{background:var(--green);color:#fff}
.mode-opt.active[data-mode="demo"]{background:#f59e0b;color:#fff}
</style>
</head>
<body>
<div class="nav">
  <div class="logo">⚡ AlgoX</div>
  <a href="/">Dashboard</a>
  <a href="/option-chain" class="active">Option Chain</a>
  <a href="/strategy/new?asset=BTC">Strategies</a>
  <a href="/strategy-builder">Builder</a>
  <a href="/performance">Performance</a>
  <a href="/profile">Profile</a><a href="/broker">Broker</a>
  <div class="spacer"></div>
  <div id="creditsBadge" style="background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:4px;font-size:.75rem;font-weight:700;cursor:pointer" onclick="window.location='/profile'" title="Credits remaining"></div>
  <div class="user"><div class="avatar">U</div><a href="/logout" style="border:none;padding:0;font-size:.75rem">Logout</a></div>
</div>
<script>fetch('/api/credits').then(r=>r.json()).then(d=>{document.getElementById('creditsBadge').textContent='🪙 '+((d.credits_remaining??0))+' credits'})</script>
<div class="container">
  <div class="controls">
    <h1 style="margin-right:12px">Options Chain</h1>
    <select id="asset"><option value="BTC">BTC</option><option value="ETH">ETH</option><option value="NIFTY">NIFTY</option><option value="BANKNIFTY">BANKNIFTY</option><option value="FINNIFTY">FINNIFTY</option><option value="MIDCPNIFTY">MIDCPNIFTY</option><option value="SENSEX">SENSEX</option><option value="BANKEX">BANKEX</option></select>
    <div class="spot-badge" id="spotBadge">Spot: —</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:4px;padding:6px 12px;font-size:10px;color:var(--muted)" id="lotBadge">1 Lot = 0.001 BTC</div>
    <div class="mode-switch" id="modeSwitch">
      <span class="mode-opt active" data-mode="live" onclick="switchMode('live')">🟢 Live</span>
      <span class="mode-opt" data-mode="demo" onclick="switchMode('demo')">🟡 Demo</span>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <span style="color:var(--muted);font-size:10px">Click = BUY · Right-click = SELL</span>
      <button onclick="loadPositions()" style="background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:4px;font-size:11px;cursor:pointer">Positions</button>
    </div>
  </div>
  <div class="expiry-tabs" id="expiryTabs"></div>

  <!-- Strategy Builder -->
  <div class="builder" id="builder" style="display:none">
    <h3>📐 Strategy Builder</h3>
    <table class="legs-table">
      <thead><tr><th>Side</th><th>Type</th><th>Strike</th><th>Symbol</th><th>Δ</th><th>Mark</th><th>IV</th><th>Lots</th><th>Value</th><th></th></tr></thead>
      <tbody id="legsBody"></tbody>
    </table>
    <div class="summary-row" id="summaryRow"></div>
    <div class="payoff-wrap" id="payoffWrap" style="display:none"><canvas id="payoffChart" height="70"></canvas></div>
    <div style="display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px"><label style="font-size:11px;color:var(--muted)">Profile</label><select id="profileSelect" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-family:inherit;min-width:120px"><option value="">Default</option></select></div>
      <div style="display:flex;align-items:center;gap:6px"><label style="font-size:10px;color:var(--muted)">Max Profit $</label><input id="maxProfit" type="number" step="0.01" value="0" min="0" style="width:80px"></div>
      <div style="display:flex;align-items:center;gap:6px"><label style="font-size:10px;color:var(--muted)">Max Loss $</label><input id="maxLoss" type="number" step="0.01" value="0" min="0" style="width:80px"></div>
      <button class="btn-execute" onclick="executeTrade()">Execute & Monitor</button>
      <button class="btn-clear" onclick="clearLegs()">Clear All</button>
    </div>
  </div>

  <!-- Active Monitor -->
  <div class="builder" id="monitorPanel" style="display:none">
    <h3>👁 Live Strategy Monitor</h3>
    <div class="summary-row" id="monitorSummary"></div>
    <div id="monitorLog" style="background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px;max-height:180px;overflow-y:auto;font-size:11px;line-height:1.6;margin-top:8px;font-family:'SF Mono','Fira Code',monospace"></div>
    <div style="margin-top:10px">
      <button onclick="stopMonitor()" style="background:var(--red);color:#fff;border:none;padding:8px 20px;border-radius:4px;font-weight:700;cursor:pointer">Stop & Close All</button>
    </div>
  </div>

  <div class="chain-wrap">
    <table><thead id="chainHead"></thead><tbody id="chainBody"></tbody></table>
  </div>

  <!-- Open Positions -->
  <div class="positions-section" id="posSection" style="display:none">
    <div class="pos-header">
      <h3>📋 Open Positions</h3>
      <button onclick="loadPositions()" style="font-size:11px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:4px 12px;border-radius:4px;cursor:pointer">Refresh</button>
    </div>
    <div class="pos-list" id="posList"></div>
    <div class="payoff-wrap" id="posPayoffWrap" style="display:none;margin-top:10px"><canvas id="posPayoffChart" height="70"></canvas></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let chainData=[], spotPrice=0, legs=[], maxOI=1, payoffChart=null, selectedExpiry='', currentMode='live';
const LOT_SIZE = {BTC: 0.001, ETH: 0.01, NIFTY: 75, BANKNIFTY: 30, FINNIFTY: 40, MIDCPNIFTY: 75, SENSEX: 20, BANKEX: 30};
const CRYPTO = new Set(['BTC','ETH']);
function getAsset(){ return document.getElementById('asset').value }
function getLotSize(){ return LOT_SIZE[getAsset()] || 1 }
function isCrypto(){ return CRYPTO.has(getAsset()) }
function cur(v){ return (isCrypto()?'$':'₹')+(typeof v==='number'?v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—') }
function sym(){ return isCrypto()?'$':'₹' }
function f2(v){ return (typeof v==='number' && !isNaN(v)) ? v.toFixed(2) : '—' }
function f4(v){ return (typeof v==='number' && !isNaN(v)) ? v.toFixed(4) : '—' }

function getProfileId(){
  return document.getElementById('profileSelect').value || '';
}

function switchMode(mode){
  currentMode=mode;
  document.querySelectorAll('.mode-opt').forEach(el=>{el.classList.toggle('active',el.dataset.mode===mode)});
  document.getElementById('modeSwitch').style.display=isCrypto()?'flex':'none';
  // Auto-select matching profile
  const sel=document.getElementById('profileSelect');
  const target=mode==='live'?'delta_exchange':'demo';
  let found=false;
  for(const opt of sel.options){
    if(opt.dataset.broker===target){sel.value=opt.value;found=true;break}
  }
  if(!found) sel.value='';
  loadExpiries();
}

document.getElementById('asset').addEventListener('change', ()=>{
  document.getElementById('modeSwitch').style.display=isCrypto()?'flex':'none';
  loadExpiries();
});
document.getElementById('profileSelect').addEventListener('change', loadExpiries);
window.addEventListener('load', ()=>{ loadProfiles(); });

function loadProfiles(){
  fetch('/api/profiles').then(r=>r.json()).then(d=>{
    const sel=document.getElementById('profileSelect');
    sel.innerHTML='<option value="" data-broker="demo">Default Keys</option>';
    (d.profiles||[]).forEach(p=>{
      const o=document.createElement('option');o.value=p.id;o.textContent=p.name+(p.broker==='demo'?' (Demo)':' (Live)');o.dataset.broker=p.broker||'demo';sel.appendChild(o);
    });
    // Auto-select based on current mode
    switchMode(currentMode);
  });
}

function loadExpiries(){
  const asset=getAsset(), ls=getLotSize();
  document.getElementById('lotBadge').textContent=isCrypto()?'1 Lot = '+ls+' '+asset:'Lot Size = '+ls;
  fetch('/api/expiries?asset='+asset+'&profile_id='+getProfileId()).then(r=>r.json()).then(d=>{
    const tabs=document.getElementById('expiryTabs');
    tabs.innerHTML='';
    (d.expiries||[]).forEach((e,i)=>{
      const tab=document.createElement('div');
      tab.className='expiry-tab'+(i===0?' active':'');
      tab.textContent=e;
      tab.onclick=()=>{
        document.querySelectorAll('.expiry-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        selectedExpiry=e;
        loadChain();
      };
      tabs.appendChild(tab);
      if(i===0){selectedExpiry=e;loadChain()}
    });
  });
}

function loadChain(){
  const asset=getAsset(), expiry=selectedExpiry;
  if(!expiry) return;
  document.getElementById('chainBody').innerHTML='<tr><td colspan="15" style="padding:40px;color:var(--muted);text-align:center">Loading chain...</td></tr>';
  fetch(`/api/chain?asset=${asset}&expiry=${expiry}&profile_id=${getProfileId()}`).then(r=>r.json()).then(d=>{
    if(d.error){showToast(d.error,true);return}
    chainData=d.chain||[];spotPrice=d.spot_price||0;
    document.getElementById('spotBadge').textContent='Spot: '+cur(spotPrice);
    maxOI=1;
    chainData.forEach(r=>{if(r.call)maxOI=Math.max(maxOI,parseFloat(r.call.oi)||0);if(r.put)maxOI=Math.max(maxOI,parseFloat(r.put.oi)||0)});
    renderChain();
  });
}

function renderChain(){
  const head=document.getElementById('chainHead'), body=document.getElementById('chainBody');
  head.innerHTML=`<tr>
    <th class="call-hdr" colspan="7" style="text-align:center;font-size:11px;letter-spacing:1px;border-bottom:2px solid var(--green)">CALLS</th>
    <th class="strike-hdr" rowspan="2">STRIKE</th>
    <th class="put-hdr" colspan="7" style="text-align:center;font-size:11px;letter-spacing:1px;border-bottom:2px solid var(--red)">PUTS</th>
  </tr><tr>
    <th>OI</th><th>Vol</th><th>IV</th><th>Delta</th><th>Bid</th><th>Ask</th><th>Mark</th>
    <th>Mark</th><th>Bid</th><th>Ask</th><th>Delta</th><th>IV</th><th>Vol</th><th>OI</th>
  </tr>`;

  // Find ATM index
  let atmIdx=-1, minDist=Infinity;
  chainData.forEach((r,i)=>{const d=Math.abs(parseFloat(r.strike)-spotPrice);if(d<minDist){minDist=d;atmIdx=i}});

  let html='';
  chainData.forEach((row,i)=>{
    // Insert ATM bar before the ATM row
    if(i===atmIdx && spotPrice){
      html+=`<tr class="atm-bar"><td colspan="7" class="atm-line"></td><td class="atm-label"><span>ATM ${spotPrice.toLocaleString(undefined,{maximumFractionDigits:2})}</span></td><td colspan="7" class="atm-line"></td></tr>`;
    }
    const s=parseFloat(row.strike), c=row.call||{}, p=row.put||{};
    const cITM=spotPrice&&s<spotPrice, pITM=spotPrice&&s>spotPrice;
    const sel=(type,strike)=>`data-type="${type}" data-strike="${strike}" onclick="addLeg(this,'buy')" oncontextmenu="addLeg(this,'sell');return false"`;
    const ls=getLotSize(), crypto=isCrypto();
    const cOI=crypto?Math.round((parseFloat(c.oi)||0)/ls):Math.round(parseFloat(c.oi)||0);
    const pOI=crypto?Math.round((parseFloat(p.oi)||0)/ls):Math.round(parseFloat(p.oi)||0);
    const cVol=crypto?Math.round((c.volume||0)/ls):Math.round(c.volume||0);
    const pVol=crypto?Math.round((p.volume||0)/ls):Math.round(p.volume||0);
    html+=`<tr>
      <td class="call-side ${cITM?'itm':''}">${oiBar(c.oi,'call')}${fmtLots(cOI)}</td>
      <td class="call-side ${cITM?'itm':''}">${fmtLots(cVol)}</td>
      <td class="call-side ${cITM?'itm':''} iv">${c.iv?(c.iv*100).toFixed(1)+'%':'—'}</td>
      <td class="call-side ${cITM?'itm':''} delta">${c.delta?c.delta.toFixed(4):'—'}</td>
      <td class="call-side ${cITM?'itm':''} selectable" ${sel('call',row.strike)}>${c.bid?f2(c.bid):'—'}</td>
      <td class="call-side ${cITM?'itm':''} selectable" ${sel('call',row.strike)}>${c.ask?f2(c.ask):'—'}</td>
      <td class="call-side ${cITM?'itm':''} selectable" ${sel('call',row.strike)} style="font-weight:700;color:var(--green)">${c.mark_price?f2(c.mark_price):'—'}</td>
      <td class="strike-col">${Number(row.strike).toLocaleString()}</td>
      <td class="put-side ${pITM?'itm':''} selectable" ${sel('put',row.strike)} style="font-weight:700;color:var(--red)">${p.mark_price?f2(p.mark_price):'—'}</td>
      <td class="put-side ${pITM?'itm':''} selectable" ${sel('put',row.strike)}>${p.bid?f2(p.bid):'—'}</td>
      <td class="put-side ${pITM?'itm':''} selectable" ${sel('put',row.strike)}>${p.ask?f2(p.ask):'—'}</td>
      <td class="put-side ${pITM?'itm':''} delta">${p.delta?p.delta.toFixed(4):'—'}</td>
      <td class="put-side ${pITM?'itm':''} iv">${p.iv?(p.iv*100).toFixed(1)+'%':'—'}</td>
      <td class="put-side ${pITM?'itm':''}">${fmtLots(pVol)}</td>
      <td class="put-side ${pITM?'itm':''}">${oiBar(p.oi,'put')}${fmtLots(pOI)}</td>
    </tr>`;
  });
  body.innerHTML=html;

  // Re-apply leg highlights
  legs.forEach(l=>{
    document.querySelectorAll(`td[data-strike="${l.strike}"][data-type="${l.type}"]`).forEach(el=>{
      el.classList.add(l.side==='buy'?'selected-buy':'selected-sell');
    });
  });

  // Scroll to ATM
  if(atmIdx>=0){const rows=body.querySelectorAll('tr');(rows[atmIdx+1]||rows[atmIdx])?.scrollIntoView({block:'center'})}
}

function oiBar(oi,type){const v=parseFloat(oi)||0;return `<span class="oi-bar ${type}" style="width:${Math.min(40,(v/maxOI)*40)}px"></span>`}
function fmtLots(n){return n>=1000?(n/1000).toFixed(2)+'K':n.toString()}

// ── Strategy Builder ──

function addLeg(el,side){
  const type=el.dataset.type, strike=el.dataset.strike;
  const row=chainData.find(r=>r.strike===strike);if(!row)return;
  const opt=type==='call'?row.call:row.put;if(!opt)return;
  // Toggle: if same option exists, remove it
  const existing=legs.findIndex(l=>l.symbol===opt.symbol);
  if(existing>=0){legs.splice(existing,1);renderChain();renderLegs();return}
  legs.push({side,type,strike,symbol:opt.symbol,product_id:opt.product_id,delta:opt.delta,mark:opt.mark_price,iv:opt.iv,size:1});
  el.classList.add(side==='buy'?'selected-buy':'selected-sell');
  renderLegs();
}

function toggleSide(idx){
  legs[idx].side=legs[idx].side==='buy'?'sell':'buy';
  renderChain();renderLegs();
}

function removeLeg(idx){legs.splice(idx,1);renderChain();renderLegs()}

function renderLegs(){
  const builder=document.getElementById('builder');
  builder.style.display=legs.length?'block':'none';
  document.getElementById('legsBody').innerHTML=legs.map((l,i)=>{
    const lotVal=(l.mark*l.size*getLotSize()).toFixed(2);
    return `<tr>
    <td><div class="side-toggle" onclick="toggleSide(${i})">
      <span class="buy ${l.side==='buy'?'active-buy':''}">BUY</span>
      <span class="sell ${l.side==='sell'?'active-sell':''}">SELL</span>
    </div></td>
    <td>${l.type.toUpperCase()}</td>
    <td>${Number(l.strike).toLocaleString()}</td>
    <td style="font-size:11px">${l.symbol}</td>
    <td class="delta">${l.delta.toFixed(2)}</td>
    <td>${sym()}${l.mark.toFixed(2)}</td>
    <td class="iv">${l.iv?(l.iv*100).toFixed(1)+'%':'—'}</td>
    <td><input type="number" value="${l.size}" min="1" onchange="legs[${i}].size=+this.value;renderLegs()"></td>
    <td style="color:${l.side==='sell'?'var(--green)':'var(--red)'}">
${sym()}${lotVal}</td>
    <td class="remove" onclick="removeLeg(${i})">✕</td>
  </tr>`}).join('');
  updateSummary();
}

function updateSummary(){
  const ls=getLotSize();
  let netCredit=0, marginReq=0;
  legs.forEach(l=>{
    const prem=l.mark*l.size*ls;
    if(l.side==='sell'){netCredit+=prem;marginReq+=prem*2}
    else{netCredit-=prem}
  });

  // Compute payoff at expiry across a range of spot prices
  const strikes=legs.map(l=>parseFloat(l.strike));
  const minS=Math.min(...strikes,spotPrice)*0.85, maxS=Math.max(...strikes,spotPrice)*1.15;
  const step=(maxS-minS)/100;
  const xs=[], ys=[];
  let minPnl=Infinity, maxPnl=-Infinity;
  for(let s=minS;s<=maxS;s+=step){
    let pnl=0;
    legs.forEach(l=>{
      const K=parseFloat(l.strike), dir=l.side==='buy'?1:-1, q=l.size*ls;
      let intrinsic=l.type==='call'?Math.max(s-K,0):Math.max(K-s,0);
      pnl+=dir*(intrinsic-l.mark)*q;
    });
    xs.push(Math.round(s));ys.push(parseFloat(pnl.toFixed(2)));
    minPnl=Math.min(minPnl,pnl);maxPnl=Math.max(maxPnl,pnl);
  }

  const label=netCredit>=0?'Net Credit':'Net Debit';
  const color=netCredit>=0?'var(--green)':'var(--red)';
  const asset=getAsset();
  document.getElementById('summaryRow').innerHTML=`
    <div class="item"><div class="lbl">${label}</div><div class="val" style="color:${color}">${sym()}${Math.abs(netCredit).toFixed(2)}</div></div>
    <div class="item"><div class="lbl">Max Profit</div><div class="val" style="color:var(--green)">${maxPnl>=1e6?'∞':sym()+maxPnl.toFixed(2)}</div></div>
    <div class="item"><div class="lbl">Max Loss</div><div class="val" style="color:var(--red)">${Math.abs(minPnl)>=1e6?'∞':sym()+minPnl.toFixed(2)}</div></div>
    <div class="item"><div class="lbl">Est. Margin</div><div class="val">${sym()}${marginReq.toFixed(2)}</div></div>
    <div class="item"><div class="lbl">Lot Size</div><div class="val">${ls} ${asset}</div></div>
    <div class="item"><div class="lbl">Legs</div><div class="val">${legs.length}</div></div>`;

  // Payoff chart
  const wrap=document.getElementById('payoffWrap');
  wrap.style.display=legs.length?'block':'none';
  if(!legs.length)return;

  // Color: green above 0, red below
  const colors=ys.map(y=>y>=0?'rgba(2,192,118,0.7)':'rgba(246,70,93,0.7)');

  if(payoffChart){payoffChart.destroy()}
  payoffChart=new Chart(document.getElementById('payoffChart'),{
    type:'line',
    data:{
      labels:xs,
      datasets:[{
        label:'P&L at Expiry',
        data:ys,
        borderColor:'var(--accent)',
        borderWidth:2,
        pointRadius:0,
        fill:{target:'origin',above:'rgba(2,192,118,0.1)',below:'rgba(246,70,93,0.1)'},
        tension:0.1
      }]
    },
    options:{
      responsive:true,animation:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:ctx=>'P&L: '+sym()+ctx.parsed.y.toFixed(2)}}
      },
      scales:{
        x:{title:{display:true,text:'Spot Price at Expiry',color:'#848e9c',font:{size:10}},ticks:{color:'#848e9c',maxTicksLimit:10,font:{size:10}},grid:{color:'rgba(0,0,0,0.06)'}},
        y:{title:{display:true,text:'Profit / Loss',color:'#848e9c',font:{size:10}},ticks:{color:'#848e9c',font:{size:10}},grid:{color:'rgba(0,0,0,0.06)'},
          afterDataLimits:s=>{if(s.min>0)s.min=-s.max*0.1;if(s.max<0)s.max=-s.min*0.1}
        }
      },
      plugins2:{annotation:{annotations:{zero:{type:'line',yMin:0,yMax:0,borderColor:'rgba(255,255,255,0.2)',borderWidth:1}}}}
    },
    plugins:[{
      id:'zeroLine',
      afterDraw(chart){
        const yScale=chart.scales.y;
        const y=yScale.getPixelForValue(0);
        if(y>=chart.chartArea.top&&y<=chart.chartArea.bottom){
          const ctx2=chart.ctx;ctx2.save();ctx2.beginPath();ctx2.moveTo(chart.chartArea.left,y);
          ctx2.lineTo(chart.chartArea.right,y);ctx2.strokeStyle='rgba(0,0,0,0.15)';ctx2.lineWidth=1;ctx2.setLineDash([4,4]);ctx2.stroke();ctx2.restore();
        }
        if(spotPrice){
          const xScale=chart.scales.x;
          const xIdx=xs.findIndex(v=>v>=spotPrice);
          if(xIdx>=0){
            const x=xScale.getPixelForValue(xIdx);
            const ctx3=chart.ctx;ctx3.save();ctx3.beginPath();ctx3.moveTo(x,chart.chartArea.top);
            ctx3.lineTo(x,chart.chartArea.bottom);ctx3.strokeStyle='rgba(26,26,46,0.4)';ctx3.lineWidth=1;ctx3.setLineDash([4,4]);ctx3.stroke();
            ctx3.fillStyle='#1a1a2e';ctx3.font='10px monospace';ctx3.fillText('Spot',x-12,chart.chartArea.top-4);ctx3.restore();
          }
        }
      }
    }]
  });
}

function clearLegs(){legs=[];renderChain();renderLegs()}

let currentMonitorId=null, monitorTimer=null;

function executeTrade(){
  if(!legs.length)return;
  const maxProfit=parseFloat(document.getElementById('maxProfit').value)||0;
  const maxLoss=parseFloat(document.getElementById('maxLoss').value)||0;
  const desc=legs.map(l=>`${l.side.toUpperCase()} ${l.size}x ${l.type.toUpperCase()} ${Number(l.strike).toLocaleString()}`).join('\n');
  let msg='Execute strategy?\n\n'+desc;
  if(maxProfit>0&&maxLoss>0) msg+=`\n\nAuto-close at: +${sym()}${maxProfit.toFixed(2)} / -${sym()}${maxLoss.toFixed(2)}`;
  if(!confirm(msg))return;

  const payload={
    legs:legs.map(l=>({product_id:l.product_id,symbol:l.symbol,size:l.size,side:l.side,type:l.type,strike:l.strike,mark:l.mark})),
    max_profit:maxProfit, max_loss:maxLoss, asset:getAsset(), profile_id:getProfileId()
  };
  fetch('/api/place-legs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>r.json()).then(d=>{
      if(d.error){showToast(d.error,true);return}
      const ok=(d.results||[]).filter(r=>r.success).length;
      const fail=(d.results||[]).length-ok;
      showToast(`${ok} order(s) placed`+(fail?`, ${fail} failed`:''));
      if(!fail) clearLegs();
      if(d.monitor_id){
        currentMonitorId=d.monitor_id;
        document.getElementById('monitorPanel').style.display='block';
        monitorTimer=setInterval(pollMonitor,5000);
        pollMonitor();
      }
    });
}

function pollMonitor(){
  if(!currentMonitorId)return;
  fetch('/api/monitor/'+currentMonitorId).then(r=>r.json()).then(d=>{
    if(d.error){clearInterval(monitorTimer);return}
    const pnlColor=d.current_pnl>=0?'var(--green)':'var(--red)';
    const pct=d.max_profit?(d.current_pnl/d.max_profit*100).toFixed(1):0;
    document.getElementById('monitorSummary').innerHTML=`
      <div class="item"><div class="lbl">Current PnL</div><div class="val" style="color:${pnlColor}">${sym()}${d.current_pnl.toFixed(2)}</div></div>
      <div class="item"><div class="lbl">Target Profit</div><div class="val" style="color:var(--green)">${sym()}${d.max_profit.toFixed(2)}</div></div>
      <div class="item"><div class="lbl">Max Loss</div><div class="val" style="color:var(--red)">-${sym()}${d.max_loss.toFixed(2)}</div></div>
      <div class="item"><div class="lbl">Status</div><div class="val">${d.running?'🟢 Live':'⚫ '+(d.exit_reason||'Stopped')}</div></div>
      <div class="item"><div class="lbl">Legs</div><div class="val">${(d.legs||[]).length}</div></div>`;

    const logEl=document.getElementById('monitorLog');
    logEl.innerHTML=(d.logs||[]).slice(-50).map(t=>{
      const cls=t.includes('✗')||t.includes('🛑')?'err':t.includes('✓')||t.includes('✅')||t.includes('🎯')?'ok':t.includes('📊')?'info':'';
      return `<div class="line ${cls}">${t}</div>`;
    }).join('');
    logEl.scrollTop=logEl.scrollHeight;

    if(!d.running){clearInterval(monitorTimer);showToast('Strategy closed: '+(d.exit_reason||'stopped'),d.exit_reason==='max_loss')}
  });
}

function stopMonitor(){
  if(!currentMonitorId)return;
  if(!confirm('Stop monitoring and close all legs?'))return;
  fetch('/api/monitor/'+currentMonitorId+'/stop',{method:'POST'}).then(r=>r.json()).then(()=>{
    clearInterval(monitorTimer);pollMonitor();
  });
}

function showToast(msg,isError){
  const t=document.getElementById('toast');t.textContent=msg;
  t.className='toast'+(isError?' error':'');t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

// ── Open Positions ──
let openPositions=[], selectedPosIdx=new Set(), posPayoffChart=null;

function loadPositions(){
  fetch('/api/positions?profile_id='+getProfileId()).then(r=>r.json()).then(d=>{
    if(d.error){showToast(d.error,true);return}
    openPositions=d.positions||[];
    selectedPosIdx.clear();
    document.getElementById('posSection').style.display=openPositions.length?'block':'none';
    if(!openPositions.length){showToast('No open positions',false);return}
    renderPositions();
  });
}

function togglePos(idx){
  if(selectedPosIdx.has(idx)) selectedPosIdx.delete(idx);
  else selectedPosIdx.add(idx);
  renderPositions();
}

function selectAllPos(){
  if(selectedPosIdx.size===openPositions.length) selectedPosIdx.clear();
  else openPositions.forEach((_,i)=>selectedPosIdx.add(i));
  renderPositions();
}

function renderPositions(){
  const list=document.getElementById('posList');
  list.innerHTML=openPositions.map((p,i)=>{
    const sel=selectedPosIdx.has(i)?'selected':'';
    const ls=LOT_SIZE[getAsset()]||0.001;
    const lots=p.size;
    const val=(p.entry_price*lots*ls).toFixed(2);
    return `<div class="pos-card ${sel}" onclick="togglePos(${i})">
      <div class="pos-sym"><span class="pos-side ${p.side}">${p.side.toUpperCase()}</span> ${p.symbol}</div>
      <div class="pos-row"><span>Strike</span><span class="v">${Number(p.strike).toLocaleString()}</span></div>
      <div class="pos-row"><span>Type</span><span class="v">${p.type.toUpperCase()}</span></div>
      <div class="pos-row"><span>Lots</span><span class="v">${lots}</span></div>
      <div class="pos-row"><span>Entry</span><span class="v">${sym()}${p.entry_price.toFixed(2)}</span></div>
      <div class="pos-row"><span>Value</span><span class="v" style="color:${p.side==='sell'?'var(--green)':'var(--red)'}">
${sym()}${val}</span></div>
    </div>`;
  }).join('')+`<div class="pos-card" onclick="selectAllPos()" style="display:flex;align-items:center;justify-content:center;min-height:80px;border-style:dashed;color:var(--muted)">
    ${selectedPosIdx.size===openPositions.length?'Deselect All':'Select All'}
  </div>`;

  renderPosPayoff();
}

function renderPosPayoff(){
  const wrap=document.getElementById('posPayoffWrap');
  if(!selectedPosIdx.size){wrap.style.display='none';return}
  wrap.style.display='block';

  const selLegs=[...selectedPosIdx].map(i=>openPositions[i]);
  const ls=LOT_SIZE[getAsset()]||0.001;
  const strikes=selLegs.map(l=>parseFloat(l.strike));
  const sp=spotPrice||strikes.reduce((a,b)=>a+b,0)/strikes.length;
  const minS=Math.min(...strikes,sp)*0.85, maxS=Math.max(...strikes,sp)*1.15;
  const step=(maxS-minS)/100;
  const xs=[], ys=[];

  for(let s=minS;s<=maxS;s+=step){
    let pnl=0;
    selLegs.forEach(l=>{
      const K=parseFloat(l.strike), dir=l.side==='buy'?1:-1, q=l.size*ls;
      const intrinsic=l.type==='call'?Math.max(s-K,0):Math.max(K-s,0);
      pnl+=dir*(intrinsic-l.entry_price)*q;
    });
    xs.push(Math.round(s));ys.push(parseFloat(pnl.toFixed(2)));
  }

  if(posPayoffChart) posPayoffChart.destroy();
  posPayoffChart=new Chart(document.getElementById('posPayoffChart'),{
    type:'line',
    data:{labels:xs,datasets:[{
      label:'Position P&L at Expiry',data:ys,
      borderColor:'#1a1a2e',borderWidth:2,pointRadius:0,
      fill:{target:'origin',above:'rgba(2,192,118,0.12)',below:'rgba(246,70,93,0.12)'},tension:0.1
    }]},
    options:{
      responsive:true,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'P&L: '+sym()+ctx.parsed.y.toFixed(2)}}},
      scales:{
        x:{title:{display:true,text:'Spot at Expiry',color:'#848e9c',font:{size:10}},ticks:{color:'#848e9c',maxTicksLimit:10,font:{size:10}},grid:{color:'rgba(0,0,0,0.06)'}},
        y:{title:{display:true,text:'P&L ('+sym()+')',color:'#848e9c',font:{size:10}},ticks:{color:'#848e9c',font:{size:10}},grid:{color:'rgba(0,0,0,0.06)'},
          afterDataLimits:s=>{if(s.min>0)s.min=-s.max*0.1;if(s.max<0)s.max=-s.min*0.1}}
      }
    },
    plugins:[{id:'posZero',afterDraw(chart){
      const y=chart.scales.y.getPixelForValue(0);
      if(y>=chart.chartArea.top&&y<=chart.chartArea.bottom){
        const ctx2=chart.ctx;ctx2.save();ctx2.beginPath();ctx2.moveTo(chart.chartArea.left,y);
        ctx2.lineTo(chart.chartArea.right,y);ctx2.strokeStyle='rgba(0,0,0,0.15)';ctx2.lineWidth=1;ctx2.setLineDash([4,4]);ctx2.stroke();ctx2.restore();
      }
      if(sp){
        const xIdx=xs.findIndex(v=>v>=sp);
        if(xIdx>=0){const x=chart.scales.x.getPixelForValue(xIdx);
          const ctx3=chart.ctx;ctx3.save();ctx3.beginPath();ctx3.moveTo(x,chart.chartArea.top);ctx3.lineTo(x,chart.chartArea.bottom);
          ctx3.strokeStyle='rgba(26,26,46,0.4)';ctx3.lineWidth=1;ctx3.setLineDash([4,4]);ctx3.stroke();
          ctx3.fillStyle='#1a1a2e';ctx3.font='10px monospace';ctx3.fillText('Spot',x-12,chart.chartArea.top-4);ctx3.restore();
        }
      }
    }}]
  });
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart — AlgoX</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{background:#131722;color:#d1d4dc;margin:0}
.chart-top{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#1e222d;border-bottom:1px solid #2a2e39;flex-wrap:wrap}
.chart-top select{background:#2a2e39;border:1px solid #363a45;color:#d1d4dc;padding:4px 10px;border-radius:4px;font-size:.8rem;cursor:pointer;font-family:inherit}
.tf-btns{display:flex;gap:1px;background:#2a2e39;border-radius:4px;overflow:hidden}
.tf-btn{padding:4px 12px;border:none;font-size:.75rem;font-weight:600;cursor:pointer;background:transparent;color:#787b86;font-family:inherit;transition:all .1s}
.tf-btn.active{background:#2962ff;color:#fff}
.tf-btn:hover:not(.active){color:#d1d4dc}
.ind-btns{display:flex;gap:2px;margin-left:8px}
.ind-btn{padding:3px 8px;border:1px solid #363a45;border-radius:3px;font-size:.7rem;font-weight:600;cursor:pointer;background:transparent;color:#787b86;font-family:inherit;transition:all .1s}
.ind-btn.active{background:rgba(41,98,255,.2);color:#2962ff;border-color:#2962ff}
.ind-btn:hover:not(.active){color:#d1d4dc;border-color:#787b86}
#lastPrice{font-weight:800;font-size:.95rem;margin-left:10px;color:#d1d4dc}
#changeLabel{font-size:.8rem;font-weight:600;margin-left:4px}
.chart-main{display:grid;grid-template-columns:1fr 280px;height:calc(100vh - 95px)}
.chart-left{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chart-wrap{flex:1;position:relative;min-height:0;overflow:hidden}
#tvChart{position:absolute;top:0;left:0;right:0;bottom:0}
#rsiChart{width:100%;height:120px;border-top:1px solid #2a2e39;display:none;flex-shrink:0}
.zoom-controls{position:absolute;bottom:36px;left:10px;display:flex;flex-direction:column;gap:2px;z-index:10}
.zoom-btn{width:28px;height:28px;border:1px solid #363a45;border-radius:4px;background:#1e222d;color:#787b86;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .1s;line-height:1}
.zoom-btn:hover{color:#d1d4dc;border-color:#787b86;background:#2a2e39}
/* Bottom tabs */
.chart-tabs{display:flex;border-top:1px solid #2a2e39;background:#1e222d}
.chart-tab{padding:6px 14px;font-size:.75rem;font-weight:600;color:#787b86;cursor:pointer;border-bottom:2px solid transparent;transition:all .12s}
.chart-tab:hover{color:#d1d4dc}
.chart-tab.active{color:#2962ff;border-bottom-color:#2962ff}
.tab-content{background:#1e222d;max-height:160px;overflow-y:auto;font-size:.78rem;display:none}
.tab-content.active{display:block}
.tab-content table{width:100%;border-collapse:collapse}
.tab-content th{text-align:left;padding:4px 10px;color:#787b86;font-size:.68rem;text-transform:uppercase;border-bottom:1px solid #2a2e39;position:sticky;top:0;background:#1e222d}
.tab-content td{padding:4px 10px;border-bottom:1px solid #2a2e39;font-family:'SF Mono',monospace;font-size:.76rem}
/* Right panel */
.side-panel{display:flex;flex-direction:column;overflow-y:auto;background:#1e222d;border-left:1px solid #2a2e39}
.sp-section{padding:10px 12px;border-bottom:1px solid #2a2e39}
.sp-section h3{font-size:.72rem;font-weight:700;margin-bottom:6px;color:#787b86;text-transform:uppercase;letter-spacing:.4px}
.signal-box{padding:8px 10px;border-radius:5px;font-size:.8rem;font-weight:600;line-height:1.4}
.signal-bullish{background:rgba(38,166,91,.1);border:1px solid rgba(38,166,91,.2);color:#26a65b}
.signal-bearish{background:rgba(234,57,67,.1);border:1px solid rgba(234,57,67,.2);color:#ea3943}
.signal-ranging{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#f59e0b}
.trend-badge{padding:2px 8px;border-radius:3px;font-size:.72rem;font-weight:700}
.trend-bullish{background:rgba(38,166,91,.15);color:#26a65b}
.trend-bearish{background:rgba(234,57,67,.15);color:#ea3943}
.trend-ranging{background:rgba(245,158,11,.15);color:#f59e0b}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.stat-item{background:#131722;border-radius:4px;padding:6px;text-align:center}
.stat-item .lbl{font-size:.6rem;color:#787b86;text-transform:uppercase;letter-spacing:.3px}
.stat-item .val{font-size:.85rem;font-weight:800;margin-top:1px}
.sr-list,.swing-list{list-style:none;margin:0;padding:0}
.sr-list li,.swing-list li{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid #2a2e39;font-size:.76rem}
.sr-tag{font-size:.63rem;font-weight:700;padding:1px 6px;border-radius:3px}
.sr-s{background:rgba(38,166,91,.15);color:#26a65b}
.sr-r{background:rgba(234,57,67,.15);color:#ea3943}
.sw-tag{font-size:.63rem;font-weight:700;padding:1px 5px;border-radius:3px}
.sw-b{background:rgba(38,166,91,.15);color:#26a65b}
.sw-e{background:rgba(234,57,67,.15);color:#ea3943}
.sr-price{font-weight:700;font-family:'SF Mono',monospace;font-size:.78rem}
@media(max-width:900px){.chart-main{grid-template-columns:1fr;height:auto}.chart-left{min-height:500px}.side-panel{max-height:50vh}}
</style>
</head>
<body>
<div class="nav">
  <div class="logo">⚡ AlgoX</div>
  <a href="/">Dashboard</a>
  <a href="/option-chain">Option Chain</a>
  <a href="/strategy-builder">Builder</a>
  <a href="/chart" class="active">Chart</a>
  <a href="/profile">Profile</a>
  <div class="spacer"></div>
  <div id="creditsBadge" style="background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:4px;font-size:.75rem;font-weight:700;cursor:pointer" onclick="window.location='/profile'"></div>
  <div class="user"><div class="avatar">{{ username[0]|upper }}</div><span>{{ username }}</span><a href="/logout" style="border:none;padding:0;font-size:.75rem">Logout</a></div>
</div>
<script>fetch('/api/credits').then(r=>r.json()).then(d=>{document.getElementById('creditsBadge').textContent='🪙 '+((d.credits_remaining??0))+' credits'})</script>

<div class="chart-top">
  <select id="symbol" onchange="loadAll()">
    <option value="BTC" selected>BTC / USD</option>
    <option value="ETH">ETH / USD</option>
    <option value="NIFTY">NIFTY 50</option>
    <option value="BANKNIFTY">BANK NIFTY</option>
    <option value="FINNIFTY">FIN NIFTY</option>
    <option value="SENSEX">SENSEX</option>
  </select>
  <div class="tf-btns">
    <button class="tf-btn" data-tf="15m" onclick="setTF(this)">15m</button>
    <button class="tf-btn active" data-tf="1h" onclick="setTF(this)">1H</button>
    <button class="tf-btn" data-tf="1d" onclick="setTF(this)">1D</button>
  </div>
  <span id="lastPrice"></span>
  <span id="changeLabel"></span>
  <span id="trendBadge" style="margin-left:4px"></span>
  <div class="ind-btns">
    <button class="ind-btn" data-ind="sma20" onclick="toggleInd(this)">SMA 20</button>
    <button class="ind-btn" data-ind="sma50" onclick="toggleInd(this)">SMA 50</button>
    <button class="ind-btn" data-ind="ema20" onclick="toggleInd(this)">EMA 20</button>
    <button class="ind-btn" data-ind="bb" onclick="toggleInd(this)">BB</button>
    <button class="ind-btn" data-ind="vwap" onclick="toggleInd(this)">VWAP</button>
    <button class="ind-btn" data-ind="supertrend" onclick="toggleInd(this)">Supertrend</button>
    <button class="ind-btn" data-ind="rsi" onclick="toggleInd(this)">RSI</button>
  </div>
</div>

<div class="chart-main">
  <div class="chart-left">
    <div class="chart-wrap">
      <div id="tvChart"></div>
      <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()" title="Zoom in">+</button>
        <button class="zoom-btn" onclick="zoomOut()" title="Zoom out">−</button>
        <button class="zoom-btn" onclick="resetChart()" title="Reset" style="font-size:.8rem">⟳</button>
      </div>
    </div>
    <div id="rsiChart"></div>
    <div class="chart-tabs">
      <div class="chart-tab active" onclick="switchTab('positions')">Positions</div>
      <div class="chart-tab" onclick="switchTab('sr')">S/R Levels</div>
      <div class="chart-tab" onclick="switchTab('swings')">Swing Points</div>
    </div>
    <div class="tab-content active" id="tab-positions">
      <div style="padding:10px;color:#787b86;font-size:.8rem" id="posContent">No open positions. <a href="/option-chain" style="color:#2962ff">Go to Option Chain →</a></div>
    </div>
    <div class="tab-content" id="tab-sr">
      <table><thead><tr><th>Type</th><th>Price</th><th>Strength</th></tr></thead><tbody id="srTable"></tbody></table>
    </div>
    <div class="tab-content" id="tab-swings">
      <table><thead><tr><th>Type</th><th>Price</th><th>Time</th></tr></thead><tbody id="swingTable"></tbody></table>
    </div>
  </div>

  <div class="side-panel">
    <div class="sp-section">
      <h3>🧠 Signal</h3>
      <div class="signal-box signal-ranging" id="signalBox">Loading...</div>
    </div>
    <div class="sp-section">
      <h3>📊 Stats</h3>
      <div class="stat-grid" id="statsGrid"></div>
    </div>
    <div class="sp-section">
      <h3>🎯 Key Levels</h3>
      <ul class="sr-list" id="srList"><li style="color:#787b86">Loading...</li></ul>
    </div>
    <div class="sp-section">
      <h3>📐 Structure</h3>
      <ul class="swing-list" id="swingList"><li style="color:#787b86">Loading...</li></ul>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
let currentTF='1h';
let mainChart=null,candleSeries=null,volumeSeries=null;
let rsiChartObj=null,rsiSeries=null;
let indSeries={};  // track overlay line series by name
let activeInds=new Set();

function getSym(){return document.getElementById('symbol').value}

function setTF(btn){
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentTF=btn.dataset.tf;
  loadAll();
}

function resetChart(){if(!mainChart)return;mainChart.timeScale().fitContent();setTimeout(()=>{const ts=mainChart.timeScale();const r=ts.getVisibleLogicalRange();if(r){const ns=(r.to-r.from)*Math.pow(0.6,5);ts.setVisibleLogicalRange({from:r.to-ns,to:r.to})}if(rsiChartObj)rsiChartObj.timeScale().fitContent()},50)}

function zoomIn(){if(!mainChart)return;const ts=mainChart.timeScale();const r=ts.getVisibleLogicalRange();if(r){const span=r.to-r.from;const mid=(r.from+r.to)/2;const ns=Math.max(span*0.6,10);ts.setVisibleLogicalRange({from:mid-ns/2,to:mid+ns/2})}}

function zoomOut(){if(!mainChart)return;const ts=mainChart.timeScale();const r=ts.getVisibleLogicalRange();if(r){const span=r.to-r.from;const mid=(r.from+r.to)/2;const ns=span*1.5;ts.setVisibleLogicalRange({from:mid-ns/2,to:mid+ns/2})}}

function toggleInd(btn){
  const name=btn.dataset.ind;
  btn.classList.toggle('active');
  if(activeInds.has(name))activeInds.delete(name); else activeInds.add(name);
  loadAll();
}

function switchTab(name){
  document.querySelectorAll('.chart-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.chart-tab[onclick*="${name}"]`).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

const CHART_OPTS={
  layout:{background:{type:'solid',color:'#131722'},textColor:'#d1d4dc',fontSize:11},
  grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},
  crosshair:{mode:0,vertLine:{color:'#758696',width:1,style:3,labelBackgroundColor:'#2a2e39'},horzLine:{color:'#758696',width:1,style:3,labelBackgroundColor:'#2a2e39'}},
  rightPriceScale:{borderColor:'#2a2e39',scaleMargins:{top:0.05,bottom:0.05}},
  timeScale:{timeVisible:true,secondsVisible:false,borderColor:'#2a2e39',rightOffset:5,barSpacing:6},
  handleScroll:true,handleScale:true,
};

function initMainChart(){
  const el=document.getElementById('tvChart');
  if(mainChart){mainChart.remove();mainChart=null;indSeries={}}
  const w=el.clientWidth||el.parentElement.clientWidth;
  const h=el.clientHeight||el.parentElement.clientHeight||500;
  mainChart=LightweightCharts.createChart(el,{...CHART_OPTS,width:w,height:h,timeScale:{...CHART_OPTS.timeScale,timeVisible:currentTF!=='1d'}});
  candleSeries=mainChart.addCandlestickSeries({upColor:'#26a65b',downColor:'#ea3943',borderUpColor:'#26a65b',borderDownColor:'#ea3943',wickUpColor:'#26a65b',wickDownColor:'#ea3943'});
  volumeSeries=mainChart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol',lastValueVisible:false,priceLineVisible:false});
  mainChart.priceScale('vol').applyOptions({scaleMargins:{top:0.82,bottom:0}});
  new ResizeObserver(()=>{if(mainChart){const rw=el.clientWidth;const rh=el.clientHeight;if(rw&&rh)mainChart.applyOptions({width:rw,height:rh})}}).observe(el);
}

function initRsiChart(){
  const el=document.getElementById('rsiChart');
  if(rsiChartObj){rsiChartObj.remove();rsiChartObj=null}
  el.style.display='block';
  rsiChartObj=LightweightCharts.createChart(el,{...CHART_OPTS,width:el.clientWidth,height:120,rightPriceScale:{...CHART_OPTS.rightPriceScale,scaleMargins:{top:0.08,bottom:0.08}},timeScale:{...CHART_OPTS.timeScale,timeVisible:currentTF!=='1d',visible:false}});
  rsiSeries=rsiChartObj.addLineSeries({color:'#7c3aed',lineWidth:1.5,priceLineVisible:false,lastValueVisible:true});
  // 30/70 levels
  const lev30=rsiChartObj.addLineSeries({color:'#363a45',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
  const lev70=rsiChartObj.addLineSeries({color:'#363a45',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false});
  rsiChartObj._lev30=lev30;rsiChartObj._lev70=lev70;
  new ResizeObserver(()=>{if(rsiChartObj)rsiChartObj.applyOptions({width:el.clientWidth})}).observe(el);
}

function syncTimeScales(){
  if(!mainChart||!rsiChartObj)return;
  mainChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&rsiChartObj)rsiChartObj.timeScale().setVisibleLogicalRange(r)});
  rsiChartObj.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&mainChart)mainChart.timeScale().setVisibleLogicalRange(r)});
}

function loadAll(){
  if(!mainChart)initMainChart();
  const indList=[...activeInds].join(',');
  fetch(`/api/chart-data?symbol=${getSym()}&interval=${currentTF}&indicators=${indList}`).then(r=>r.json()).then(d=>{
    if(d.error)return;

    // Candles + volume
    const ohlc=d.candles.map(c=>({time:c.t,open:c.o,high:c.h,low:c.l,close:c.c}));
    const vol=d.candles.map(c=>({time:c.t,value:c.v||0,color:c.c>=c.o?'rgba(38,166,91,0.25)':'rgba(234,57,67,0.25)'}));
    candleSeries.setData(ohlc);
    volumeSeries.setData(vol);

    // Clear old indicator series
    Object.keys(indSeries).forEach(k=>{try{mainChart.removeSeries(indSeries[k])}catch(e){}});
    indSeries={};

    const inds=d.indicators||{};

    // Overlay indicators
    if(inds.sma20){const s=mainChart.addLineSeries({color:'#6366f1',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,title:'SMA 20'});s.setData(inds.sma20.data);indSeries.sma20=s}
    if(inds.sma50){const s=mainChart.addLineSeries({color:'#f59e0b',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,title:'SMA 50'});s.setData(inds.sma50.data);indSeries.sma50=s}
    if(inds.ema20){const s=mainChart.addLineSeries({color:'#8b5cf6',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,title:'EMA 20'});s.setData(inds.ema20.data);indSeries.ema20=s}
    if(inds.vwap){const s=mainChart.addLineSeries({color:'#ec4899',lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,title:'VWAP'});s.setData(inds.vwap.data);indSeries.vwap=s}

    // Bollinger Bands
    if(inds.bb){
      const su=mainChart.addLineSeries({color:'rgba(33,150,243,0.5)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
      const sm=mainChart.addLineSeries({color:'rgba(33,150,243,0.8)',lineWidth:1,lineStyle:2,priceLineVisible:false,lastValueVisible:false,title:'BB'});
      const sl=mainChart.addLineSeries({color:'rgba(33,150,243,0.5)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
      su.setData(inds.bb.upper);sm.setData(inds.bb.mid);sl.setData(inds.bb.lower);
      indSeries.bb_u=su;indSeries.bb_m=sm;indSeries.bb_l=sl;
    }

    // Supertrend — green/red segments
    if(inds.supertrend){
      const bullData=[],bearData=[];
      inds.supertrend.data.forEach((p,i,arr)=>{
        const pt={time:p.time,value:p.value};
        if(p.dir===1){bullData.push(pt);bearData.push({time:p.time,value:NaN})}
        else{bearData.push(pt);bullData.push({time:p.time,value:NaN})}
        // connect transition points
        if(i>0&&arr[i-1].dir!==p.dir){
          if(p.dir===1)bullData[bullData.length-1]={time:p.time,value:p.value};
          else bearData[bearData.length-1]={time:p.time,value:p.value};
        }
      });
      const sb=mainChart.addLineSeries({color:'#26a65b',lineWidth:2,priceLineVisible:false,lastValueVisible:false,title:'ST'});
      const ss=mainChart.addLineSeries({color:'#ea3943',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
      sb.setData(bullData);ss.setData(bearData);
      indSeries.st_b=sb;indSeries.st_s=ss;
    }

    // RSI panel
    if(inds.rsi&&inds.rsi.data&&inds.rsi.data.length){
      if(!rsiChartObj){initRsiChart();syncTimeScales()}
      document.getElementById('rsiChart').style.display='block';
      rsiSeries.setData(inds.rsi.data);
      // level lines
      const times=inds.rsi.data.map(p=>p.time);
      rsiChartObj._lev30.setData(times.map(t=>({time:t,value:30})));
      rsiChartObj._lev70.setData(times.map(t=>({time:t,value:70})));
      rsiChartObj.timeScale().fitContent();
    } else {
      document.getElementById('rsiChart').style.display='none';
      if(rsiChartObj){rsiChartObj.remove();rsiChartObj=null}
    }

    mainChart.timeScale().fitContent();
    // Default zoom: 5x zoom in (show recent candles)
    setTimeout(()=>{const ts=mainChart.timeScale();const r=ts.getVisibleLogicalRange();if(r){const span=r.to-r.from;const ns=span*Math.pow(0.6,5);ts.setVisibleLogicalRange({from:r.to-ns,to:r.to})}},50);

    // Header info
    const last=d.candles[d.candles.length-1],first=d.candles[0];
    const chg=(last.c-first.o)/first.o*100;
    document.getElementById('lastPrice').textContent=last.c.toLocaleString(undefined,{maximumFractionDigits:2});
    const cl=document.getElementById('changeLabel');
    cl.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';
    cl.style.color=chg>=0?'#26a65b':'#ea3943';

    const tc={'Bullish':'trend-bullish','Bearish':'trend-bearish'}[d.trend]||'trend-ranging';
    document.getElementById('trendBadge').innerHTML=`<span class="trend-badge ${tc}">${d.trend==='Bullish'?'▲':d.trend==='Bearish'?'▼':'◆'} ${d.trend}</span>`;

    const sb=document.getElementById('signalBox');
    sb.textContent=d.signal;
    sb.className='signal-box '+(d.trend==='Bullish'?'signal-bullish':d.trend==='Bearish'?'signal-bearish':'signal-ranging');

    const high=Math.max(...d.candles.map(c=>c.h)),low=Math.min(...d.candles.map(c=>c.l));
    document.getElementById('statsGrid').innerHTML=`
      <div class="stat-item"><div class="lbl">Open</div><div class="val">${first.o.toLocaleString()}</div></div>
      <div class="stat-item"><div class="lbl">Close</div><div class="val">${last.c.toLocaleString()}</div></div>
      <div class="stat-item"><div class="lbl">High</div><div class="val" style="color:#26a65b">${high.toLocaleString()}</div></div>
      <div class="stat-item"><div class="lbl">Low</div><div class="val" style="color:#ea3943">${low.toLocaleString()}</div></div>
      <div class="stat-item"><div class="lbl">Swings</div><div class="val">${(d.swings||[]).length}</div></div>
      <div class="stat-item"><div class="lbl">S/R Zones</div><div class="val">${(d.sr_zones||[]).length}</div></div>`;

    document.getElementById('srList').innerHTML=(d.sr_zones||[]).map(z=>
      `<li><span class="sr-tag ${z.type==='support'?'sr-s':'sr-r'}">${z.type==='support'?'S':'R'}</span><span class="sr-price">${z.price.toLocaleString()}</span><span style="color:#787b86;font-size:.63rem">×${z.strength}</span></li>`
    ).join('')||'<li style="color:#787b86">—</li>';

    document.getElementById('srTable').innerHTML=(d.sr_zones||[]).map(z=>
      `<tr><td><span class="sr-tag ${z.type==='support'?'sr-s':'sr-r'}">${z.type.toUpperCase()}</span></td><td class="sr-price">${z.price.toLocaleString()}</td><td>×${z.strength}</td></tr>`
    ).join('');

    document.getElementById('swingList').innerHTML=(d.swings||[]).slice(-8).reverse().map(s=>{
      const bull=s.type==='HH'||s.type==='HL';
      return `<li><span class="sw-tag ${bull?'sw-b':'sw-e'}">${s.type}</span><span class="sr-price">${s.price.toLocaleString()}</span></li>`;
    }).join('')||'<li style="color:#787b86">—</li>';

    document.getElementById('swingTable').innerHTML=(d.swings||[]).slice().reverse().map(s=>{
      const bull=s.type==='HH'||s.type==='HL';
      const dt=new Date(s.time*1000);
      return `<tr><td><span class="sw-tag ${bull?'sw-b':'sw-e'}">${s.type}</span></td><td class="sr-price">${s.price.toLocaleString()}</td><td style="color:#787b86">${dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} ${dt.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</td></tr>`;
    }).join('');
  });
  loadPositions();
}

function loadPositions(){
  fetch('/api/positions?profile_id=').then(r=>r.json()).then(d=>{
    if(d.error||!d.positions||!d.positions.length){
      document.getElementById('posContent').innerHTML='No open positions. <a href="/option-chain" style="color:#2962ff">Go to Option Chain →</a>';
      return;
    }
    document.getElementById('posContent').innerHTML=`<table><thead><tr><th>Symbol</th><th>Side</th><th>Size</th><th>Entry</th><th>Mark</th><th>P&L</th></tr></thead><tbody>`+
      d.positions.map(p=>{
        const pnl=p.unrealized_pnl||0;
        return `<tr><td>${p.symbol}</td><td style="color:${p.side==='sell'?'#ea3943':'#26a65b'};font-weight:700">${p.side.toUpperCase()}</td><td>${p.size}</td><td>${p.entry_price?.toFixed(2)||'—'}</td><td>${p.mark_price?.toFixed(2)||'—'}</td><td style="color:${pnl>=0?'#26a65b':'#ea3943'};font-weight:700">${pnl.toFixed(2)}</td></tr>`;
      }).join('')+`</tbody></table>`;
  }).catch(()=>{});
}

loadAll();
</script>
</body>
</html>
